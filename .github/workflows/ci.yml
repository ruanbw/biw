name: ci

# Least privilege: the workflow only reads the repository. Without this block the token gets the
# repository default, which is write access for a dependency lifecycle script to abuse.
permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (unit)
    runs-on: ubuntu-latest
    # A hung build otherwise burns the six-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Compile
        run: mvn -B -ntp -DskipTests compile
      - name: Test
        run: mvn -B -ntp test
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: surefire
          path: target/surefire-reports/

  # `sql/init.sql` is the only schema and nothing in the unit suite executes it: a missing comma
  # or a wrong column name would pass every test and only appear on someone's first
  # `docker compose up`. This job applies both scripts to a real PostgreSQL, twice (they claim to
  # be re-runnable), and asserts the grants the application depends on.
  schema:
    name: schema (init.sql against PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_DB: biw
          POSTGRES_USER: biw
          # Throwaway instance, reachable only from this job.
          POSTGRES_PASSWORD: ci-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U biw -d biw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: biw
      PGPASSWORD: ci-not-a-secret
      POSTGRES_USER: biw
      POSTGRES_DB: biw
      APP_DB_PASSWORD: app-password
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Apply the schema and the application role
        run: |
          psql -d biw -v ON_ERROR_STOP=1 -q -f sql/init.sql
          bash sql/02-app-role.sh
      - name: Both scripts are re-runnable
        run: |
          psql -d biw -v ON_ERROR_STOP=1 -q -f sql/init.sql
          bash sql/02-app-role.sh
      - name: The schema and the least-privilege grants are what the code expects
        run: |
          tables=$(psql -d biw -tAc "select count(*) from information_schema.tables where table_schema = 'public'")
          if [ "$tables" != "6" ]; then
            echo "expected 6 tables in public, found $tables"
            exit 1
          fi

          # The application role writes audit rows ...
          PGPASSWORD=app-password psql -h localhost -U biw_app -d biw -q \
            -c "insert into sys_audit_log (action, outcome) values ('ci.check', 'SUCCESS')"

          # ... and cannot rewrite or delete them.
          for statement in "update sys_audit_log set action = 'x'" "delete from sys_audit_log"; do
            if PGPASSWORD=app-password psql -h localhost -U biw_app -d biw -q -c "$statement" 2>/dev/null; then
              echo "the application role must not be able to run: $statement"
              exit 1
            fi
          done

          # The username shape is enforced by the database too, not only by the API.
          if psql -d biw -q -c "insert into sys_user (username, password_hash) values ('Not Valid!', 'x')" 2>/dev/null; then
            echo "the username CHECK constraint is missing"
            exit 1
          fi

  frontend:
    name: admin (lint + typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # package.json requires >= 20.19.0; `20` happens to resolve to that today, which is a
          # coincidence rather than a guarantee.
          node-version: '20.19.0'
          cache: pnpm
          cache-dependency-path: admin/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # `pnpm lint` runs with --fix, which would repair the tree and exit 0: a gate that cannot
      # fail. `lint:ci` is the same rule set without the writer.
      - run: pnpm lint:ci
      - run: pnpm typecheck
      - run: pnpm build

  # The integration layer is not wired yet: it needs a Testcontainers run (PostgreSQL 18 +
  # Redis 8) and a Docker daemon. The job is declared so adding src/test/java/com/biw/it and
  # `mvn verify -Pit` is a one-line change rather than a workflow rewrite.
  #
  # backend-it:
  #   name: backend (integration)
  #   needs: backend
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
  #     - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
  #       with: { java-version: '21', distribution: temurin, cache: maven }
  #     - run: docker pull postgres:18-alpine && docker pull redis:7-alpine
  #     - run: mvn -B -ntp verify -Pit
