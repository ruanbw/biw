name: ci

# Least privilege: the workflow only reads the repository. Without this block the token gets the
# repository default, which is write access for a dependency lifecycle script to abuse.
permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (unit)
    runs-on: ubuntu-latest
    # A hung build otherwise burns the six-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Compile
        run: mvn -B -ntp -DskipTests compile
      - name: Test
        run: mvn -B -ntp test
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: surefire
          path: target/surefire-reports/

  frontend:
    name: admin (lint + typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # package.json requires >= 20.19.0; `20` happens to resolve to that today, which is a
          # coincidence rather than a guarantee.
          node-version: '20.19.0'
          cache: pnpm
          cache-dependency-path: admin/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # `pnpm lint` runs with --fix, which would repair the tree and exit 0: a gate that cannot
      # fail. `lint:ci` is the same rule set without the writer.
      - run: pnpm lint:ci
      - run: pnpm typecheck
      - run: pnpm build

  # The integration layer is not wired yet: it needs a Testcontainers run (PostgreSQL 18 +
  # Redis 8) and a Docker daemon. The job is declared so adding src/test/java/com/biw/it and
  # `mvn verify -Pit` is a one-line change rather than a workflow rewrite.
  #
  # backend-it:
  #   name: backend (integration)
  #   needs: backend
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
  #     - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
  #       with: { java-version: '21', distribution: temurin, cache: maven }
  #     - run: docker pull postgres:18-alpine && docker pull redis:7-alpine
  #     - run: mvn -B -ntp verify -Pit
