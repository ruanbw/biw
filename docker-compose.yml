# Local PostgreSQL + Redis for development.
#
#   docker compose up -d
#   docker compose ps          # wait for both to become healthy
#   docker compose down        # stop (data stays in the named volumes)
#   docker compose down -v     # stop and wipe data
#
# Credentials match src/main/resources/application-dev.yml defaults.
# Ports are bound to 127.0.0.1 on purpose: nothing is exposed to the LAN.
services:
  postgres:
    image: postgres:18-alpine
    container_name: biw-postgres
    environment:
      POSTGRES_DB: biw
      POSTGRES_USER: biw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpass}
      # The application connects as this role (created by 02-app-role.sh), not as the image's
      # superuser. Keep it in sync with DB_USERNAME / DB_PASSWORD on the application side.
      APP_DB_USERNAME: ${DB_USERNAME:-biw_app}
      APP_DB_PASSWORD: ${DB_PASSWORD:-apppass}
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 moved PGDATA to /var/lib/postgresql/<major>/data, so the mount has to be
      # the parent directory; mounting /var/lib/postgresql/data makes the image refuse to start.
      - biw-pgdata:/var/lib/postgresql
      # The schema, applied once when the volume is empty. This base project has one schema file,
      # not a migration chain: change sql/init.sql and rebuild with `down -v && up -d`.
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      # Runs after the schema: grants the application the DML-only role it connects as.
      - ./sql/02-app-role.sh:/docker-entrypoint-initdb.d/02-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biw -d biw"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - biw-net

  redis:
    image: redis:8-alpine
    container_name: biw-redis
    # Sa-Token keeps every session in this instance, so it has to require a password even on
    # localhost: any process on the machine could otherwise export every live token.
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-devpass}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-devpass}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - biw-redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

    # No capabilities: redis needs none, and dropping them bounds what a compromised image or a
    # future `command` override can do.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - biw-net

volumes:
  biw-pgdata:
  biw-redisdata:

# Both services live on their own network. Anything else started on the default bridge cannot
# reach 5432/6379 without explicitly joining.
networks:
  biw-net:
    name: biw-net
