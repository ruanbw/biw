# Local PostgreSQL + Redis for development.
#
#   docker compose up -d
#   docker compose ps          # wait for both to become healthy
#   docker compose down        # stop (data stays in the named volumes)
#   docker compose down -v     # stop and wipe data
#
# Credentials match src/main/resources/application-dev.yml defaults.
# Ports are bound to 127.0.0.1 on purpose: nothing is exposed to the LAN.
services:
  postgres:
    image: postgres:18-alpine
    container_name: biw-postgres
    environment:
      POSTGRES_DB: biw
      POSTGRES_USER: biw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpass}
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 moved PGDATA to /var/lib/postgresql/<major>/data, so the mount has to be
      # the parent directory; mounting /var/lib/postgresql/data makes the image refuse to start.
      - biw-pgdata:/var/lib/postgresql
      # The schema, applied once when the volume is empty. This base project has one schema file,
      # not a migration chain: change sql/init.sql and rebuild with `down -v && up -d`.
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biw -d biw"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: biw-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - biw-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  biw-pgdata:
  biw-redisdata:
