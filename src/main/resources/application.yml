# ---------------------------------------------------------------
# Shared configuration. Environment-specific values live in
# application-{dev,test,prod}.yml and application-local.yml
# (local is git-ignored; start from application-local.yml.example).
# ---------------------------------------------------------------
spring:
  application:
    name: biw
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    # Omits nulls from responses; Result.data opts back in with @JsonInclude(ALWAYS).
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      force: true

# ---------------------------------------------------------------
# OpenAPI 3 / Swagger UI
# http://localhost:8080/swagger-ui.html
# http://localhost:8080/v3/api-docs
#
# Off unless a profile turns it on: a deployment that forgets to set its
# profile must not publish the API contract. dev and test enable it.
# ---------------------------------------------------------------
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
    try-it-out-enabled: true

# ---------------------------------------------------------------
# MyBatis-Plus
# ---------------------------------------------------------------
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ---------------------------------------------------------------
# Sa-Token
# Sessions are persisted in Redis (see sa-token-redis-template).
# ---------------------------------------------------------------
sa-token:
  token-name: satoken
  # 7 days absolute
  timeout: 604800
  # 30 minutes of inactivity; an idle session is logged out
  active-timeout: 1800
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-print: false
  is-log: false
