# ---------------------------------------------------------------
# Shared configuration. Environment-specific values live in
# application-{dev,test,prod}.yml and application-local.yml
# (local is git-ignored; start from application-local.yml.example).
# ---------------------------------------------------------------
spring:
  application:
    name: biw
  profiles:
    # No default on purpose. A deployment that forgets SPRING_PROFILES_ACTIVE must fail to start,
    # not boot with the dev datasource, SQL echo, and Swagger UI (see application-dev.yml).
    active: ${SPRING_PROFILES_ACTIVE}
  jackson:
    # Omits nulls from responses; Result.data opts back in with @JsonInclude(ALWAYS).
    default-property-inclusion: non_null

# ---------------------------------------------------------------------------
# Application configuration
# ---------------------------------------------------------------------------
biw:
  bootstrap:
    admin:
      # The first administrator. No account is seeded in sql/init.sql, so set both on the first
      # start against an empty database. Both are ignored once an account exists, and blank
      # values are ignored entirely.
      username: ${BIW_BOOTSTRAP_ADMIN_USERNAME:}
      password: ${BIW_BOOTSTRAP_ADMIN_PASSWORD:}
  security:
    login-throttle:
      # Defaults are template decisions, not rules: a derived project with a different user base
      # should review them. See docs/EXTENDING.md.
      max-account-failures: ${BIW_LOGIN_MAX_ACCOUNT_FAILURES:10}
      max-client-failures: ${BIW_LOGIN_MAX_CLIENT_FAILURES:50}
      window: ${BIW_LOGIN_WINDOW:5m}
  audit:
    jdbc:
      # Rows in sys_audit_log in addition to the log line. Off by default because the table only
      # exists once sql/init.sql has run; application-prod.yml turns it on.
      #
      # The application may only INSERT (and SELECT) here — sql/02-app-role.sh revokes UPDATE and
      # DELETE — so the retention sweep is an operator job: run sql/03-audit-retention.sql nightly
      # as the database owner. See docs/EXTENDING.md.
      enabled: ${BIW_AUDIT_JDBC_ENABLED:false}
  web:
    cors:
      # Empty means no CORS headers are sent; the Vite dev proxy makes them unnecessary locally.
      allowed-origins: ${BIW_CORS_ALLOWED_ORIGINS:}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # The API answers with its own Result envelope; these only shape container-level /error
  # responses. Set here rather than in the prod profile so a new profile inherits the safe side.
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false
  servlet:
    encoding:
      charset: UTF-8
      force: true

# ---------------------------------------------------------------
# Actuator: only the health endpoint, and never with details.
# ---------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# ---------------------------------------------------------------
# OpenAPI 3 / Swagger UI
# http://localhost:8080/swagger-ui.html
# http://localhost:8080/v3/api-docs
#
# Off unless a profile turns it on: a deployment that forgets to set its
# profile must not publish the API contract. dev and test enable it.
# ---------------------------------------------------------------
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
    try-it-out-enabled: true

# ---------------------------------------------------------------
# MyBatis-Plus
# ---------------------------------------------------------------
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    # Binds state enums to the native PostgreSQL enum types (user_status, role_status).
    default-enum-type-handler: com.biw.common.mybatis.PostgresEnumTypeHandler
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ---------------------------------------------------------------
# Sa-Token
# Sessions are persisted in Redis (see sa-token-redis-template).
# ---------------------------------------------------------------
sa-token:
  token-name: satoken
  # 8 hours absolute: long enough for an admin shift, short enough that a stolen token dies.
  timeout: ${SA_TOKEN_TIMEOUT:28800}
  # 30 minutes of inactivity; an idle session is logged out. Overridable like every other knob:
  # a kiosk and an admin console do not want the same idle window.
  active-timeout: ${SA_TOKEN_ACTIVE_TIMEOUT:1800}
  is-concurrent: true
  is-share: false
  # At most three live sessions per account; a fourth evicts the oldest. Without a ceiling a
  # stolen token survives until its absolute timeout no matter how often the owner logs in.
  max-login-count: ${SA_TOKEN_MAX_LOGIN_COUNT:3}
  token-style: uuid
  is-print: false
  is-log: false
  # The token travels in the `satoken` request header and nowhere else. A cookie would ride along
  # on cross-site requests and would be readable by any script on the origin; a body or query
  # parameter puts the token in URLs, and from there into Referer headers and proxy logs.
  is-read-body: false
  is-read-cookie: false
  cookie:
    # Unused while is-read-cookie is false; set here so flipping it back on fails safe.
    http-only: true
    secure: true
    same-site: Lax
