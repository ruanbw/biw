# Development environment: local PostgreSQL + Redis, verbose logging.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/biw
    username: ${DB_USERNAME:biw}
    password: ${DB_PASSWORD:devpass}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: biw-hikari
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: localhost
      port: 6379
      # Matches docker-compose.yml; an open Redis on this host is a session stealer.
      password: ${REDIS_PASSWORD:devpass}
      database: 0
      timeout: 3s
      connect-timeout: 3s
      lettuce:
        pool:
          enabled: true
          max-active: 16
          max-idle: 8
          min-idle: 2

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

sa-token:
  # Session logging writes token values into the application log; keep it off even here.
  is-log: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    com.biw: debug
    # info, not debug: at DEBUG Spring MVC echoes every request and response body, which is
    # exactly where a plaintext password and a live token end up in logs/biw.log.
    org.springframework.web: info
    org.springframework.jdbc.core: debug
