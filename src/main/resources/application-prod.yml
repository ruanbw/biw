# Production environment: everything comes from environment variables,
# no secret is committed to git.
spring:
  datasource:
    url: ${DB_URL}
    # Must be the DML-only application role, not the schema owner: see sql/02-app-role.sh.
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: biw-hikari
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      # Required, no default: the sessions live here, so an unauthenticated Redis is a
      # session stealer. Startup fails when the variable is missing, which is the point.
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
      lettuce:
        pool:
          enabled: true
          max-active: ${REDIS_POOL_MAX_ACTIVE:32}
          max-idle: ${REDIS_POOL_MAX_IDLE:16}
          min-idle: ${REDIS_POOL_MIN_IDLE:4}

server:
  # `server.error.include-*` is set once in application.yml; only the proxy hint is prod-specific.
  forward-headers-strategy: native

sa-token:
  is-log: false

# API docs stay off here; SPRINGDOC_ENABLED=true turns them on when someone really needs them.

biw:
  audit:
    # Rows as well as log lines: a production deployment needs a record that outlives the log
    # rotation. Turn it off only when the database is not the right sink for you.
    jdbc:
      enabled: ${BIW_AUDIT_JDBC_ENABLED:true}

logging:
  level:
    root: info
    com.biw: info
